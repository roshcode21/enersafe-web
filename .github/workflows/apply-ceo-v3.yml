name: Apply ENERSAFE CEO proposal v3

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/v3chunk17.txt'
      - '.proposal_payload/v3trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild, repair JS and validate CEO proposal v3
        shell: bash
        run: |
          set -euo pipefail
          cat .proposal_payload/v3chunk*.txt > /tmp/enersafe-v3.b64
          base64 --decode /tmp/enersafe-v3.b64 > /tmp/enersafe-v3.tgz
          echo '34c114ee90ffe3a51e525f6e6bfef412e6ec874717bc884f05ff267d9ed5b89d  /tmp/enersafe-v3.tgz' | sha256sum -c -
          tar -xzf /tmp/enersafe-v3.tgz -C .

          python - <<'PY'
          from pathlib import Path
          p = Path('js/site.js')
          s = p.read_text()
          marker = '/* —— Tema —— */'
          i = s.index(marker)
          before = s[:i]
          trimmed = before.rstrip()
          if trimmed.endswith(']'):
              pos = before.rfind(']')
              before = before[:pos+1] + ';' + before[pos+1:]
              s = before + s[i:]
              p.write_text(s)
          PY

          node --check js/site.js
          grep -q 'Todo tu SGM en una sola plataforma' index.html
          grep -q 'MIDESAFE se implementa con el sistema de Control Volumétrico' midesafe-sgm.html
          grep -q 'SASISOPA y NOM-005, con seguimiento durante la operación' gasafe-plus.html
          if grep -q 'Trabaja con distintos controles volumétricos' index.html midesafe-sgm.html autoconsumo.html; then
            echo 'Rejected copy still present'; exit 1
          fi
          if grep -q 'El SGM que el SAT exige' index.html midesafe-sgm.html; then
            echo 'Legacy MIDESAFE hero still present'; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js
          git commit -m "Publish ENERSAFE CEO proposal v3"
          git push origin preview
