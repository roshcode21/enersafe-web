name: Apply ENERSAFE CEO proposal v3

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/v3repair-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild, repair JS and validate CEO proposal v3
        shell: bash
        run: |
          set -euo pipefail

          echo '6ca1fa5bc2287f9040b87c201e10eaecaebbe533dbee28f27f3919674e8de5f4  .proposal_payload/repair05a.txt' | sha256sum -c -
          echo 'ae2ecf40e5d99d6bda247bb6c236a78265ef85833db26a0690338d8c31786417  .proposal_payload/repair05b.txt' | sha256sum -c -
          echo 'd1196d36dc79332d6e1cf7508af762a06fec8c4b84707ccfa2e6f610e70a165f  .proposal_payload/repair06a.txt' | sha256sum -c -
          echo 'a049fc6ca564fa8cd450c70dccffe44f22170fa16d39802d0351f7643e96f633  .proposal_payload/repair06b.txt' | sha256sum -c -
          echo '75f51c2a09e2ca0ea0be0e7e84e27d65fef9ac42bd4cbeb4c2ecbf48c262f274  .proposal_payload/repair10a.txt' | sha256sum -c -
          echo '9cbc4e6e50846d9778ac0692166ed66a29cf4045464392f83679c095ff59137f  .proposal_payload/repair10b.txt' | sha256sum -c -
          echo 'd9f92d4ddd441df6f39cb6be010788c1edf9fa20bedb17bc372672dfbae07d1d  .proposal_payload/repair14a.txt' | sha256sum -c -
          echo 'a7efddfe591d346ea75debb0ace6936215fec3837ffcfe89170a7023d96e3cbb  .proposal_payload/repair14b.txt' | sha256sum -c -

          cat \
            .proposal_payload/v3chunk00.txt \
            .proposal_payload/v3chunk01.txt \
            .proposal_payload/v3chunk02.txt \
            .proposal_payload/v3chunk03.txt \
            .proposal_payload/v3chunk04.txt \
            .proposal_payload/repair05a.txt \
            .proposal_payload/repair05b.txt \
            .proposal_payload/repair06a.txt \
            .proposal_payload/repair06b.txt \
            .proposal_payload/v3chunk07.txt \
            .proposal_payload/v3chunk08.txt \
            .proposal_payload/v3chunk09.txt \
            .proposal_payload/repair10a.txt \
            .proposal_payload/repair10b.txt \
            .proposal_payload/v3chunk11.txt \
            .proposal_payload/v3chunk12.txt \
            .proposal_payload/v3chunk13.txt \
            .proposal_payload/repair14a.txt \
            .proposal_payload/repair14b.txt \
            .proposal_payload/v3chunk15.txt \
            .proposal_payload/v3chunk16.txt \
            .proposal_payload/v3chunk17.txt \
            > /tmp/enersafe-v3.b64

          base64 --decode /tmp/enersafe-v3.b64 > /tmp/enersafe-v3.tgz
          echo '34c114ee90ffe3a51e525f6e6bfef412e6ec874717bc884f05ff267d9ed5b89d  /tmp/enersafe-v3.tgz' | sha256sum -c -
          tar -xzf /tmp/enersafe-v3.tgz -C .

          python - <<'PY'
          from pathlib import Path
          p = Path('js/site.js')
          s = p.read_text()
          marker = '/* —— Tema —— */'
          i = s.index(marker)
          before = s[:i]
          if before.rstrip().endswith(']'):
              pos = before.rfind(']')
              before = before[:pos+1] + ';' + before[pos+1:]
              s = before + s[i:]
              p.write_text(s)
          PY

          node --check js/site.js
          grep -q 'Todo tu SGM en una sola plataforma' index.html
          grep -q 'MIDESAFE se implementa con el sistema de Control Volumétrico' midesafe-sgm.html
          grep -q 'SASISOPA y NOM-005, con seguimiento durante la operación' gasafe-plus.html
          if grep -q 'Trabaja con distintos controles volumétricos' index.html midesafe-sgm.html autoconsumo.html; then
            echo 'Rejected copy still present'; exit 1
          fi
          if grep -q 'El SGM que el SAT exige' index.html midesafe-sgm.html; then
            echo 'Legacy MIDESAFE hero still present'; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js
          git commit -m "Publish ENERSAFE CEO proposal v3"
          git push origin preview
