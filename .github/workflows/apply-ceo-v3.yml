name: Apply ENERSAFE CEO proposal v3

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/v3trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild and publish CEO proposal v3
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/enersafe-v3.b64
          for i in 00 01 02 03 04; do cat ".proposal_payload/v3chunk${i}.txt" >> /tmp/enersafe-v3.b64; done
          cat .proposal_payload/repair05a.txt .proposal_payload/repair05b.txt >> /tmp/enersafe-v3.b64
          cat .proposal_payload/repair06a.txt .proposal_payload/repair06b.txt >> /tmp/enersafe-v3.b64
          for i in 07 08 09; do cat ".proposal_payload/v3chunk${i}.txt" >> /tmp/enersafe-v3.b64; done
          cat .proposal_payload/repair10a.txt .proposal_payload/repair10b.txt >> /tmp/enersafe-v3.b64
          for i in 11 12 13; do cat ".proposal_payload/v3chunk${i}.txt" >> /tmp/enersafe-v3.b64; done
          cat .proposal_payload/repair14a.txt .proposal_payload/repair14b.txt >> /tmp/enersafe-v3.b64
          for i in 15 16 17; do cat ".proposal_payload/v3chunk${i}.txt" >> /tmp/enersafe-v3.b64; done

          base64 --decode /tmp/enersafe-v3.b64 > /tmp/enersafe-v3.tgz
          echo '34c114ee90ffe3a51e525f6e6bfef412e6ec874717bc884f05ff267d9ed5b89d  /tmp/enersafe-v3.tgz' | sha256sum -c -
          tar -xzf /tmp/enersafe-v3.tgz -C .

          python - <<'PY'
          from pathlib import Path
          p = Path('js/site.js')
          s = p.read_text()
          marker = '/* —— Tema —— */'
          i = s.index(marker)
          before = s[:i]
          if before.rstrip().endswith(']'):
              pos = before.rfind(']')
              s = before[:pos+1] + ';' + before[pos+1:] + s[i:]
              p.write_text(s)
          PY

          node --check js/site.js
          if grep -q 'Trabaja con distintos controles volumétricos' index.html midesafe-sgm.html autoconsumo.html servicios.html; then
            echo 'Rejected copy still present'; exit 1
          fi
          if grep -q 'El SGM que el SAT exige' index.html midesafe-sgm.html; then
            echo 'Legacy MIDESAFE hero still present'; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js llms.txt sitemap.xml
          git commit -m "Publish ENERSAFE CEO proposal v3"
          git push origin preview
