name: Apply ENERSAFE CEO proposal

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/chunk11.txt'
      - '.github/workflows/apply-ceo-proposal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild, apply proposal and ensure content visibility
        shell: bash
        run: |
          set -euo pipefail
          cat .proposal_payload/chunk*.txt > /tmp/enersafe-proposal.b64
          base64 --decode /tmp/enersafe-proposal.b64 > /tmp/enersafe-proposal.tgz
          tar -xzf /tmp/enersafe-proposal.tgz -C .

          cat >> css/styles.css <<'CSSFIX'

          /* CEO PREVIEW HOTFIX · 2026-09-09
             En la propuesta navegable todo el contenido debe ser visible aun si
             IntersectionObserver o las animaciones de entrada no se inicializan. */
          .reveal,
          .reveal-l,
          .reveal-r,
          .reveal-scale {
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
          }
          CSSFIX

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js css/styles.css llms.txt sitemap.xml
          git commit -m "Apply CEO proposal with visibility hotfix"
          git push origin preview
