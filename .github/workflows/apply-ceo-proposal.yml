name: Apply ENERSAFE CEO proposal v4

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/v4chunk03.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Apply and validate CEO proposal v4
        shell: bash
        run: |
          set -euo pipefail
          cat .proposal_payload/v4chunk*.txt > /tmp/enersafe-v4.b64
          base64 --decode /tmp/enersafe-v4.b64 > /tmp/enersafe-v4.patch.xz
          echo '829bc77310e5b870b9c047b1637fed5fccc2c333c33119b1b3f411314ec891f8  /tmp/enersafe-v4.patch.xz' | sha256sum -c -
          xz -dc /tmp/enersafe-v4.patch.xz > /tmp/enersafe-v4.patch
          patch -p1 < /tmp/enersafe-v4.patch

          node --check js/site.js
          grep -q 'Todo tu SGM en una sola plataforma' index.html
          grep -q 'Todo tu SGM en una sola plataforma' midesafe-sgm.html
          grep -q 'El sistema organiza. Tu especialista ENERSAFE da seguimiento.' index.html
          grep -q 'La operación de MIDESAFE no requiere cambiar' midesafe-sgm.html
          grep -q 'SASISOPA y NOM-005, con seguimiento durante la operación.' gasafe-plus.html
          if grep -q 'Trabaja con distintos controles volumétricos' index.html midesafe-sgm.html autoconsumo.html servicios.html; then
            echo 'Found rejected control-volumetric copy'; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js llms.txt sitemap.xml
          git commit -m "Publish ENERSAFE CEO proposal v4"
          git push origin preview
