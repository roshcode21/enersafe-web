name: Apply ENERSAFE CEO proposal

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/chunk11.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild and apply proposal
        shell: bash
        run: |
          set -euo pipefail
          cat .proposal_payload/chunk*.txt > /tmp/enersafe-proposal.b64
          base64 --decode /tmp/enersafe-proposal.b64 > /tmp/enersafe-proposal.tgz
          tar -xzf /tmp/enersafe-proposal.tgz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js llms.txt sitemap.xml
          git commit -m "Apply ENERSAFE CEO review proposal"
          git push origin preview
