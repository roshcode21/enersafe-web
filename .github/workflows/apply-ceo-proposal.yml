name: Apply ENERSAFE CEO proposal v2

on:
  push:
    branches:
      - preview
    paths:
      - '.proposal_payload/v2chunk07.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Rebuild and validate CEO proposal v2
        shell: bash
        run: |
          set -euo pipefail
          cat .proposal_payload/v2chunk*.txt > /tmp/enersafe-v2.b64
          base64 --decode /tmp/enersafe-v2.b64 > /tmp/enersafe-v2.tgz
          echo '4f2aab36077aca02a727fe888f638e9a0fffdac047f40b43b99aee1e80b8af5e  /tmp/enersafe-v2.tgz' | sha256sum -c -
          tar -xzf /tmp/enersafe-v2.tgz -C .
          node --check js/site.js
          grep -q 'Tu SGM, organizado y en' index.html
          grep -q 'MIDESAFE se implementa con el sistema de Control Volumétrico' midesafe-sgm.html
          if grep -q 'Trabaja con distintos controles volumétricos' index.html midesafe-sgm.html autoconsumo.html; then
            echo 'Found rejected copy'; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html midesafe-sgm.html gasafe-plus.html autoconsumo.html servicios.html nosotros.html contacto.html preguntas-frecuentes.html js/site.js css/styles.css llms.txt sitemap.xml
          git commit -m "Rebuild ENERSAFE CEO presentation proposal"
          git push origin preview
