name: Apply ENERSAFE v4 editorial audit

on:
  push:
    branches: [preview]
    paths:
      - '.proposal_payload/v4-audit-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview

      - name: Remove legacy positioning before audit
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','midesafe-sgm.html','gasafe-plus.html','autoconsumo.html','servicios.html','nosotros.html','contacto.html','preguntas-frecuentes.html']
          replacements = [
            ('Los dos sistemas propios de ENERSAFE', 'MIDESAFE SGM y GASAFE Plus'),
            ('los dos sistemas propios de ENERSAFE', 'MIDESAFE SGM y GASAFE Plus'),
            ('Dos sistemas propios', 'Dos soluciones digitales'),
            ('dos sistemas propios', 'dos soluciones digitales'),
            ('Sistemas propios', 'Soluciones digitales'),
            ('sistemas propios', 'soluciones digitales'),
            ('Proprietary digital systems', 'Digital solutions'),
            ('proprietary digital systems', 'digital solutions'),
            ('Proprietary systems', 'Digital solutions'),
            ('proprietary systems', 'digital solutions'),
          ]
          for name in files:
            p = Path(name)
            s = p.read_text(encoding='utf-8')
            for old, new in replacements:
              s = s.replace(old, new)
            p.write_text(s, encoding='utf-8')
          PY

      - name: Apply audited content changes
        run: |
          set -euo pipefail
          python .proposal_payload/v4_apply.py

      - name: Validate JavaScript
        run: node --check js/site.js

      - name: Validate structured data and bilingual attributes
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          files = ['index.html','midesafe-sgm.html','gasafe-plus.html','autoconsumo.html','servicios.html','nosotros.html','contacto.html','preguntas-frecuentes.html']
          for name in files:
              s = Path(name).read_text(encoding='utf-8')
              for block in re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>', s, re.S):
                  json.loads(block)
              es = len(re.findall(r'\bdata-es=', s))
              en = len(re.findall(r'\bdata-en=', s))
              if es != en:
                  raise SystemExit(f'{name}: data-es/data-en mismatch {es}/{en}')
          print('Structured data and bilingual attributes OK')
          PY

      - name: Commit audited preview
        run: |
          set -euo pipefail
          rm -f .proposal_payload/v4_apply.py .proposal_payload/v4-audit-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V4 audit: correct product flows and regulatory architecture"
          git push origin HEAD:preview
